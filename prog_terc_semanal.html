<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Programação Semanal · Terceiras · PCO</title>
<script>
(function(){ if(!sessionStorage.getItem('pco_token')) window.location.href='login.html'; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lps_ei_core.css">
<style>
.causa-row{display:grid;grid-template-columns:250px 1fr 46px;gap:12px;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--border-2);font-size:11.5px}
.causa-row .cb{background:#eef1f4;height:15px}
.causa-row .cb i{display:block;height:100%;background:var(--terracota)}
.causa-row .cv{font-family:var(--mono);font-weight:700;text-align:right}
td.qtd-cell{font-family:var(--mono);font-weight:700}
.cell-in{width:100%;min-width:64px;font-size:11.5px;padding:4px 6px;border:1px solid var(--border-2);
  background:#fff;font-family:inherit}
.cell-in.num{font-family:var(--mono);text-align:right;min-width:52px}
select.cell-in{min-width:118px}
.cell-row-id{display:none}
.pill-sm{display:inline-block;font-size:9.5px;font-weight:700;font-family:var(--mono);
  padding:2px 7px;border:1px solid;white-space:nowrap}
.val-ok{background:var(--green-soft);color:#2b6027;border-color:#a8c990}
.val-pend{background:#f3f4f6;color:#6b7280;border-color:#d1d5db}
.cron-ref{font-size:10.5px;color:var(--text-mute);line-height:1.5}
.cron-ref b{color:var(--text-dim)}
.cron-ref .atr{color:var(--terracota);font-weight:700}
.cron-ref .hist{display:block;margin-top:2px;padding-top:2px;border-top:1px dotted var(--border-2)}
.cron-ref .hist .up{color:var(--green);font-weight:700}
.cron-ref .hist .down{color:var(--red);font-weight:700}

/* ---- filtros de coluna (Fase 3.14) ---- */
.grid thead th{position:relative;white-space:nowrap}
.th-f-btn{border:none;background:transparent;cursor:pointer;font-size:10px;color:var(--text-mute,#9aa1ab);
  padding:1px 3px;margin-left:3px;vertical-align:middle;border-radius:2px}
.th-f-btn:hover{color:var(--text-dim,#444);background:rgba(0,0,0,.05)}

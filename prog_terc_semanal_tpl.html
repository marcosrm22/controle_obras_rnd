.rtools input{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:12.5px;min-width:240px}
.panel + .panel{margin-top:14px}
.print-tab{display:none}
@media (max-width:1100px){.dashp .kstrip,.rk{grid-template-columns:repeat(3,1fr)}.dashp .kpi:nth-child(4),.rk .kpi:nth-child(4){border-left:0}.dashp .kpi:nth-child(n+4),.rk .kpi:nth-child(n+4){border-top:1px solid var(--grid)}}
@media (max-width:700px){
  .sticky{position:static}
  .dashp .kstrip,.rk{grid-template-columns:repeat(2,1fr)}
  .dashp .kpi,.rk .kpi{border-left:0;border-top:1px solid var(--grid)}
  .brk{grid-template-columns:1fr}
  .brk-c + .brk-c{border-left:0;border-top:1px solid var(--grid)}
  .tabsbar .tb-r{margin-left:0;width:100%}
}
@media print{
  .sticky{position:static;padding:0;margin:0}
  .tabsbar .tab:not(.on),.tabsbar .tb-r,.frow{display:none!important}
  .sticky.compact .brk{display:grid}
  .brk-l{max-height:none;overflow:visible}
  .print-tab{display:inline}
}
</style>
<style>
/* ---------- v3 (Fase 3.27): dados ao vivo, seletor de semana, Programação Geral ---------- */
.tabsbar .tb-wk{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.95}
.tabsbar .tb-wk select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:6px 8px;font-size:12px;font-weight:600}
.tabsbar .tb-wk select option{color:#10233d}
.tabsbar .tb-btn:disabled,.tabsbar select:disabled{opacity:.5;cursor:default}
.live{flex-basis:100%;font-size:11.5px;opacity:.9;display:flex;align-items:center;gap:7px;padding:2px 4px 0}
.live .muted{color:rgba(255,255,255,.65)}
.live .dot{width:8px;height:8px;border-radius:50%;flex:none;background:#9aa}
.live .dot.ok{background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.live .dot.er{background:var(--warn)}
.live .dot.ld{background:#fff;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.25}}
.hs-tag{display:inline-block;font-size:10.5px;font-weight:650;padding:1px 7px;border-radius:999px;background:var(--orange);color:#10233d;margin-left:4px}
.kpi.k-p::before{background:var(--st-p)}
.gk{grid-template-columns:repeat(6,1fr)}
.brk.g3{grid-template-columns:repeat(3,1fr);border-top:0}
.gfil{margin-bottom:14px}
.gfil .fchip.clr{background:transparent}
.chart-wrap{overflow-x:auto;padding-top:6px}
svg.chart{display:block;font-family:inherit}
svg.chart .gl{stroke:var(--grid);stroke-width:1}
svg.chart .ax{fill:var(--muted);font-size:11px}
svg.chart .xl{fill:var(--ink);font-size:12px;font-weight:650}
svg.chart .tot{fill:var(--ink);font-size:12px;font-weight:700}
svg.chart .in{fill:#fff;font-size:10.5px;font-weight:650}
svg.chart .pl{font-size:11px;font-weight:700}
svg.chart .hit{fill:transparent}
svg.chart g.bar{cursor:pointer}
svg.chart g.bar:hover .hit{fill:var(--accent-wash);opacity:.6}
.panel-h .hint{font-size:12px;color:var(--muted)}
td.pct.mudou{color:var(--warn-ink)}
.dlt{display:block;font-size:10.5px;font-weight:650;margin-top:2px}
.dlt.up{color:var(--good-ink)}
.dlt.dn{color:var(--crit-ink)}
@media (max-width:1100px){.gk{grid-template-columns:repeat(3,1fr)}.gk .kpi:nth-child(4){border-left:0}.gk .kpi:nth-child(n+4){border-top:1px solid var(--grid)}.brk.g3{grid-template-columns:1fr}.brk.g3 .brk-c + .brk-c{border-left:0;border-top:1px solid var(--grid)}}
@media (max-width:700px){.gk{grid-template-columns:repeat(2,1fr)}.gk .kpi{border-left:0;border-top:1px solid var(--grid)}}
@media print{.live,.tb-wk{display:none!important}}
</style>
</head>

};

var ACOMP_TXT = { avanco:'Com avanço', sem_avanco:'Sem avanço', restricao:'Restrição' };
var ACOMP_ICO = { avanco:'▲', sem_avanco:'○', restricao:'⚑' };

var LIVE = { estado: PODE_VIVO ? 'carregando' : 'foto', msg:'', em:null };

var REVS = {};            // id da revisão -> parseada | null (podada)

var CARREGANDO = false;

function comU(p){ return p + (p.indexOf('?') < 0 ? '?' : '&') + 'unidade=eq.' + encodeURIComponent(D.unidadeCod); }
function sbHeaders(extra){ var h = { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key }; for(var k in extra) h[k] = extra[k]; return h; }
function sbGet(path){
  return fetch(CFG.url + '/rest/v1/' + path, { headers: sbHeaders({}) }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + ': ' + t.slice(0,140)); });
    return r.json();
  });
}
function sbAll(path){
  var PAGE = 1000, out = [];
  function grab(from){
    return fetch(CFG.url + '/rest/v1/' + path, { headers: sbHeaders({'Range-Unit':'items', Range: from + '-' + (from + PAGE - 1)}) }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + ': ' + t.slice(0,140)); });
      return r.json();
    }).then(function(rows){ out = out.concat(rows || []); return (rows && rows.length === PAGE) ? grab(from + PAGE) : out; });
  }
  return grab(0);
}
function pool(itens, n, fn, prog){
  var i = 0, feitos = 0;
  function w(){ if(i >= itens.length) return Promise.resolve(); var it = itens[i++]; return Promise.resolve(fn(it)).catch(function(){}).then(function(){ feitos++; if(prog) prog(feitos, itens.length); return w(); }); }
  var ws = []; for(var k=0;k<Math.min(n, itens.length);k++) ws.push(w());
  return Promise.all(ws);
}

/* tarefas_json -> índices. l3 = uid da tarefa de 3º nível acima (ou a própria,
   se ela estiver no nível ≤ 3) — mesma chave da Matriz de Responsabilidades. */
function parseRev(tj){
  if(typeof tj === 'string'){ try{ tj = JSON.parse(tj); }catch(_){ tj = null; } }
  if(!Array.isArray(tj)) return null;
  var byUid = {}, porWbs = {}, l3 = {}, folhas = [], stack = [];
  tj.forEach(function(t){
    if(!t) return;
    var u = String(t.uid);
    byUid[u] = t; if(t.wbs) porWbs[String(t.wbs)] = t;
    var lv = t.level == null ? 99 : t.level;
    if(lv >= 1 && lv < 99){
      while(stack.length && stack[stack.length-1].level >= lv) stack.pop();
      if(lv <= 3) l3[u] = u;
      else { var a3 = stack.filter(function(s){ return s.level === 3; })[0]; l3[u] = a3 ? a3.uid : null; }
      stack.push({ level: lv, uid: u });
    }
    if(!t.summary && t.active !== false) folhas.push(t);
  });
  return { byUid: byUid, porWbs: porWbs, l3: l3, folhas: folhas };
}
function E(t){ return t == null ? null : (t.E == null ? (t.pct || 0) : t.E); }
function refIni(t){ return t.lbStart || t.start || null; }
function refFim(t){ return t.lbFinish || t.finish || null; }
function prevEm(t, data){
  var i = refIni(t), f = refFim(t);
  if(!t || !i || !f || !data) return null;
  if(data <= i) return 0; if(data >= f) return 100;
  var tot = dias(i, f); if(!tot || tot <= 0) return 100;
  return Math.round(Math.max(0, Math.min(100, dias(i, data) / tot * 100)));
}
function classificarT(t){ var e = E(t); if(e >= 100) return 'concluida'; if(t.aStart || t.aFinish || e > 0) return 'execucao'; return 'planejada'; }
function atrasadaT(t){
  var e = E(t); if(e >= 100) return false;
  var f = refFim(t), i = refIni(t);
  if(f && f < HOJE) return true;
  if(!t.aStart && i && i < HOJE) return true;
  return false;
}
function ancestrais(wbs, porWbs){
  var p = String(wbs || '').split('.'), out = [];
  for(var i=1;i<p.length;i++){ var t = porWbs[p.slice(0,i).join('.')]; if(t && t.name) out.push(t.name); }
  return out;
}

/* revisão vigente ANTES da semana (corte < quinta de início) e a de FECHAMENTO
   (1º corte a partir da terça da semana). Revisões sem detalhe (podadas pela
   retenção das 3 últimas) voltam como {podada:true}. */
function revsDe(cId){ return (RAW.revList[cId] || []); }
function revAntes(cId, wk){ var r = null; revsDe(cId).forEach(function(x){ if(d10(x.data_corte) && d10(x.data_corte) < wk) r = x; }); return r; }
function revDepois(cId, wk){ var lim = addDays(wk, 5); return revsDe(cId).filter(function(x){ return d10(x.data_corte) && d10(x.data_corte) >= lim; })[0] || null; }
function revCarregada(meta){ if(!meta) return null; var p = REVS[meta.id]; return p === undefined ? undefined : p; }

function carregarRev(meta){
  if(!meta || REVS[meta.id] !== undefined) return Promise.resolve();
  return sbGet(comU('val_revisoes?id=eq.' + meta.id + '&select=tarefas_json')).then(function(rows){
    REVS[meta.id] = (rows && rows[0] && rows[0].tarefas_json) ? parseRev(rows[0].tarefas_json) : null;
  }).catch(function(){ REVS[meta.id] = null; });
}
function garantirRevsSemana(wk){
  var metas = [];
  [wk, addDays(wk, -7)].forEach(function(w){
    RAW.cards.forEach(function(c){
      if(d10(c.semana) !== w || c.cronograma_id == null) return;
      [revAntes(c.cronograma_id, w), revDepois(c.cronograma_id, w)].forEach(function(m){ if(m && REVS[m.id] === undefined && metas.indexOf(m) < 0) metas.push(m); });
    });
  });
  if(!metas.length) return Promise.resolve();
  setLive('carregando', 'Buscando revisões dos cronogramas… 0/' + metas.length);
  return pool(metas, 6, carregarRev, function(f, t){ setLive('carregando', 'Buscando revisões dos cronogramas… ' + f + '/' + t); });
}

function carregarTudo(){
  if(!PODE_VIVO || CARREGANDO) return;
  CARREGANDO = true; LATEST = {}; REVS = {};
  setLive('carregando', 'Buscando dados no PCO…');
  Promise.all([
    sbAll(comU('val_cronogramas?select=*&order=empresa.asc')),
    sbAll(comU('val_revisoes?select=id,cronograma_id,revisao,rotulo,data_corte&order=cronograma_id.asc,revisao.asc')),
    sbAll(comU('prog_terc_programacao?select=*&ativo=eq.true&order=semana.asc,id.asc')),
    sbAll(comU('prog_terc_acomp_diario?select=programacao_id,semana,data,situacao,justificativa&order=id.asc')).catch(function(){ return []; }),
    sbAll(comU('val_matriz_resp?select=cronograma_id,terceira_uid,area,analista_planejamento,especialista,supervisor&order=id.asc')).catch(function(){ return []; }),
    sbAll(comU('prog_terc_restricoes?select=*&ativo=eq.true&order=num.asc')).catch(function(){ return []; })
  ]).then(function(r){
    var cMap = {}; (r[0]||[]).forEach(function(c){ cMap[c.id] = c; });
    var revList = {}; (r[1]||[]).forEach(function(x){ (revList[x.cronograma_id] = revList[x.cronograma_id] || []).push(x); });
    var acomp = {}; (r[3]||[]).forEach(function(a){ (acomp[a.programacao_id] = acomp[a.programacao_id] || {})[d10(a.data)] = a; });
    var mz = {}; (r[4]||[]).forEach(function(m){ mz[m.cronograma_id + '::' + m.terceira_uid] = m; });
    RAW = { contratos: r[0]||[], cMap: cMap, revList: revList, cards: r[2]||[], acomp: acomp, mz: mz, restr: r[5]||[] };
    var ids = RAW.contratos.map(function(c){ return c.id; });
    setLive('carregando', 'Abrindo cronogramas… 0/' + ids.length);
    return pool(ids, 6, function(id){
      return sbGet(comU('val_revisoes?cronograma_id=eq.' + id + '&tarefas_json=not.is.null&select=id,revisao,rotulo,data_corte,tarefas_json&order=revisao.desc&limit=1')).then(function(rows){
        if(!rows || !rows[0]) return;
        var p = parseRev(rows[0].tarefas_json);
        if(p){ p.meta = { id: rows[0].id, revisao: rows[0].revisao, rotulo: rows[0].rotulo, data_corte: rows[0].data_corte }; LATEST[id] = p; REVS[rows[0].id] = p; }
      });
    }, function(f, t){ setLive('carregando', 'Abrindo cronogramas… ' + f + '/' + t); });
  }).then(function(){
    return garantirRevsSemana(SEMANA);
  }).then(function(){
    LIVE.em = new Date();
    montarAoVivo();
    setLive('vivo', '');
  }).catch(function(e){
    setLive('erro', e.message);
  }).then(function(){ CARREGANDO = false; });
}

/* ---------- responsáveis: Matriz (3º nível) → contrato → empresa ---------- */
function respDe(cId, uid, empresa){
  var out = { sup:'', esp:'', ana:'', area:'' };
  var c = cId != null ? RAW.cMap[cId] : null;
  if(c){
    var lat = LATEST[cId], k3 = (lat && uid != null) ? lat.l3[String(uid)] : null;
    var m = k3 ? RAW.mz[cId + '::' + k3] : null;
    out.sup = ((m && m.supervisor) || c.supervisor || '').trim();
    out.esp = ((m && m.especialista) || c.especialista || '').trim();
    out.ana = ((m && m.analista_planejamento) || c.analista_planejamento || '').trim();
    out.area = ((m && m.area) || '').trim();
    return out;
  }
  var emp = norm(empresa), sups = [], esps = [];
  RAW.contratos.forEach(function(x){
    if(norm(x.empresa) !== emp) return;
    var s = (x.supervisor || '').trim(), e = (x.especialista || '').trim();
    if(s && sups.indexOf(s) < 0) sups.push(s);
    if(e && esps.indexOf(e) < 0) esps.push(e);
  });
  out.sup = sups.length === 1 ? sups[0] : '';
  out.esp = esps.length === 1 ? esps[0] : '';
  return out;
}
function passaRecorte(c){
  var f = D.filtro || {};
  if(!f.fase && !f.cwa) return true;
  var m = (D.fcMap || {})[c.id];
  if(!m) return false;
  return (!f.fase || m[0] === f.fase) && (!f.cwa || m[1] === f.cwa);
}
function numOu(v){ return (v === '' || v == null || isNaN(Number(v))) ? null : Number(v); }

function linhaAoVivo(c, wk){
  var cId = c.cronograma_id, uid = c.terceira_uid != null ? String(c.terceira_uid) : null;
  var lat = cId != null ? LATEST[cId] : null, t = (lat && uid) ? lat.byUid[uid] : null;
  var mA = cId != null ? revAntes(cId, wk) : null, mD = cId != null ? revDepois(cId, wk) : null;
  var pA = revCarregada(mA), pD = revCarregada(mD);
  var tA = (pA && uid) ? pA.byUid[uid] : null, tD = (pD && uid) ? pD.byUid[uid] : null;
  var fim = addDays(wk, 6), rs = respDe(cId, uid, c.empresa);
  var ctr = cId != null ? RAW.cMap[cId] : null;
  var wbs = c.terceira_wbs || (t ? t.wbs : '');
  var estr = (lat && wbs) ? ancestrais(wbs, lat.porWbs) : [];
  var ac = RAW.acomp[c.id] || {};
  var ds = []; for(var i=0;i<7;i++) ds.push(addDays(wk, i));
  var rotRev = function(m, p){ return m ? (m.rotulo || ('REV ' + m.revisao)) + (m.data_corte ? ' · corte ' + dmy(m.data_corte) : '') + (p === null ? ' (sem detalhe — retenção)' : '') : ''; };
  return {
    id: c.id, emp: c.empresa || (ctr ? ctr.empresa : '') || '', pai: estr.length ? estr[estr.length-1] : '', estr: estr,
    atv: c.descricao || (t ? t.name : '') || '', wbs: wbs || '',
    area: c.area || rs.area || '', disc: c.disciplina || (ctr ? ctr.disciplina : '') || '',
    sup: rs.sup, esp: rs.esp, resp: c.responsavel || '', equipe: c.equipe || '', un: c.un || '',
    real: numOu(c.pct_realizado),
    prevA: tA ? prevEm(tA, fim) : null, prevD: tD ? prevEm(tD, fim) : null,
    concA: tA ? E(tA) : null, concAt: t ? E(t) : null,
    revA: rotRev(mA, pA), revD: rotRev(mD, pD), revAt: lat && lat.meta ? rotRev(lat.meta) : '',
    semRevD: !mD,
    st: c.coluna || 'programada', causa: c.causa || '', obs: c.obs || '', val: !!c.validado,
    acomp: ds.map(function(d){ return ac[d] ? ac[d].situacao : null; }),
    restr: Object.keys(ac).sort().filter(function(d){ return ac[d].situacao === 'restricao'; }).map(function(d){ return { d: d, j: ac[d].justificativa || '' }; })
  };
}
function semanaAoVivo(wk){
  var ds = []; for(var i=0;i<7;i++) ds.push(addDays(wk, i));
  return { semana: wkLabel(wk), ini: wk, fim: addDays(wk, 6), dias: ds,
    linhas: RAW.cards.filter(function(c){ return d10(c.semana) === wk && passaRecorte(c); }).map(function(c){ return linhaAoVivo(c, wk); }) };
}
function restricoesAoVivo(wk){
  var wkAnt = addDays(wk, -7), aidSem = {};
  [[wk, wkLabel(wk)], [wkAnt, wkLabel(wkAnt)]].forEach(function(p){
    RAW.cards.forEach(function(c){
      if(d10(c.semana) !== p[0] || c.cronograma_id == null || c.terceira_uid == null || !passaRecorte(c)) return;
      var k = c.cronograma_id + '::' + c.terceira_uid;
      aidSem[k] = aidSem[k] || []; if(aidSem[k].indexOf(p[1]) < 0) aidSem[k].push(p[1]);
    });
  });
  return RAW.restr.map(function(r){
    var k = (r.cronograma_id != null && r.terceira_uid != null) ? r.cronograma_id + '::' + r.terceira_uid : null;
    var lat = r.cronograma_id != null ? LATEST[r.cronograma_id] : null;
    var t = (lat && r.terceira_uid != null) ? lat.byUid[String(r.terceira_uid)] : null;
    var ctr = r.cronograma_id != null ? RAW.cMap[r.cronograma_id] : null;
    var pai = (lat && t && t.wbs) ? ancestrais(t.wbs, lat.porWbs).slice(-1)[0] : '';
    return {
      num: r.num, desc: r.descricao || '', cat: r.categoria || '', status: r.status || 'Aberta',
      area: r.area || '', emp: r.empresa || (ctr ? ctr.empresa : '') || '',
      atv: t ? ((pai ? pai + ' · ' : '') + t.name) : (r.terceira_nome || ''), wbs: r.terceira_wbs || (t ? t.wbs : '') || '',
      resp: r.responsavel || '', setor: r.setor || '',
      ident: d10(r.data_identificacao), nec: d10(r.data_necessidade), prom: d10(r.data_prometida), rem: d10(r.data_remocao),
      impacto: r.impacto || '', acao: r.acao || '', obs: r.obs || '', prog: k ? (aidSem[k] || []) : []
    };
  }).filter(function(r){
    var ab = r.status !== 'Removida' && r.status !== 'Cancelada';
    return ab || r.prog.length || (r.rem && r.rem >= wkAnt);
  });
}
/* Programação Geral: universo = todas as atividades-folha da revisão mais
   recente de cada cronograma + histórico de cards por semana (gráficos). */
function geralAoVivo(){
  var ativ = [];
  RAW.contratos.forEach(function(c){
    var lat = LATEST[c.id]; if(!lat) return;
    lat.folhas.forEach(function(t){
      var rs = respDe(c.id, String(t.uid), c.empresa);
      ativ.push({ st: classificarT(t), atr: atrasadaT(t), sup: rs.sup, esp: rs.esp, disc: c.disciplina || '' });
    });
  });
  var porSem = {};
  RAW.cards.forEach(function(c){
    if(!passaRecorte(c)) return;
    var wk = d10(c.semana), ac = RAW.acomp[c.id] || {};
    var rs = respDe(c.cronograma_id, c.terceira_uid, c.empresa);
    var ctr = c.cronograma_id != null ? RAW.cMap[c.cronograma_id] : null;
    var r = { st: c.coluna || 'programada', real: numOu(c.pct_realizado), acomp: Object.keys(ac).map(function(d){ return ac[d].situacao; }) };
    (porSem[wk] = porSem[wk] || []).push({ cl: classe(r), sup: rs.sup, esp: rs.esp, disc: c.disciplina || (ctr ? ctr.disciplina : '') || '' });
  });
  var semanas = Object.keys(porSem).sort().map(function(wk){ return { wk: wk, label: wkLabel(wk), cards: porSem[wk] }; });
  return { ativ: ativ, semanas: semanas };
}
function semanasDisponiveis(){
  var s = {};
  if(RAW) RAW.cards.forEach(function(c){ if(passaRecorte(c)) s[d10(c.semana)] = 1; });
  s[D.semanaEmissao || D.atual.ini] = 1; s[SEMANA] = 1;
  return Object.keys(s).sort().reverse();
}
function montarAoVivo(){
  aplicarDados({
    atual: semanaAoVivo(SEMANA),
    anterior: semanaAoVivo(addDays(SEMANA, -7)),
    restricoes: restricoesAoVivo(SEMANA),
    geral: geralAoVivo()
  });
}
function trocarSemana(wk){
  if(!RAW || CARREGANDO) return;
  SEMANA = wk; CARREGANDO = true;
  garantirRevsSemana(wk).then(function(){ montarAoVivo(); setLive('vivo', ''); })
    .catch(function(e){ setLive('erro', e.message); })
    .then(function(){ CARREGANDO = false; });
}

/* =====================================================================
   2. CLASSIFICAÇÃO / ESTADO
   ===================================================================== */
var DIMS = [
  { key:'area', label:'Área',                   get:function(r){ return r.area || SEM; } },
  { key:'emp',  label:'Empresa',                get:function(r){ return r.emp  || SEM; } },
  { key:'sup',  label:'Supervisor Responsável', get:function(r){ return r.sup  || SEM; } },
  { key:'disc', label:'Disciplina',             get:function(r){ return r.disc || SEM; } }
];
var DIM = {}; DIMS.forEach(function(d){ DIM[d.key] = d; });
var POP_DIMS = ['area','emp'];
var BRK_DIMS = ['sup','disc'];
var GDIMS = [
  { key:'sup',  label:'Supervisor',   get:function(r){ return r.sup  || SEM; } },
  { key:'disc', label:'Disciplina',   get:function(r){ return r.disc || SEM; } },
  { key:'esp',  label:'Especialista', get:function(r){ return r.esp  || SEM; } }
];

/* Classificação semanal do card (partição concl + inic + nexec = programadas). */
function classe(r){
  if(r.st === 'concluida') return 'concl';
  var av = r.st === 'execucao' || (r.real != null && r.real > 0) || (r.acomp || []).indexOf('avanco') !== -1;
  return av ? 'inic' : 'nexec';
}
var STF_OK = {
  exec:  function(r){ return r._cl === 'concl' || r._cl === 'inic'; },
  inic:  function(r){ return r._cl === 'inic'; },
  concl: function(r){ return r._cl === 'concl'; },
  nexec: function(r){ return r._cl === 'nexec'; }
};
var STF_TXT = { exec:'Executadas', inic:'Iniciadas', concl:'Concluídas', nexec:'Não executadas' };

var SEMS = {}, RESTR = [], RACOMP = [], GERAL = null;
function prep(s){
  s = s || { linhas:[] };
  s.linhas = (s.linhas || []).map(function(r, i){
    r._i = i; r._cl = classe(r);
    r._busca = norm([r.emp, (r.estr || []).join(' '), r.pai, r.atv, r.wbs, r.area, r.disc, r.sup, r.esp, r.resp, r.equipe, r.causa, r.obs].join(' '));
    return r;
  });
  return s;
}
function aplicarDados(d){
  SEMS = { atual: prep(d.atual), anterior: prep(d.anterior) };
  RESTR = (d.restricoes || []).map(function(r){
    r._ab = r.status !== 'Removida' && r.status !== 'Cancelada';
    r._venc = r._ab && r.nec && String(r.nec).slice(0,10) < HOJE;
    r._busca = norm([r.num, r.desc, r.cat, r.status, r.area, r.emp, r.atv, r.wbs, r.resp, r.setor, r.impacto, r.acao, r.obs].join(' '));
    return r;
  });
  RACOMP = [];
  ['atual','anterior'].forEach(function(t){
    SEMS[t].linhas.forEach(function(r){ (r.restr || []).forEach(function(x){ RACOMP.push({ tab:t, sem:SEMS[t].semana, d:x.d, j:x.j, r:r }); }); });
  });
  RACOMP.sort(function(a, b){ return a.d < b.d ? 1 : a.d > b.d ? -1 : 0; });
  if(d.geral) GERAL = d.geral;
  if(document.getElementById('sticky')){ atualizarTabs(); preencherSemanas(); render(); }
}

var TAB = 'geral';
var F = { area:[], emp:[], sup:[], disc:[] };
var GF = { sup:[], disc:[], esp:[] };
var STF = null, Q = '', GRUPO = '', SORT = { key:null, dir:1 }, POP = null, COMPACTO = false, RF = null, RQ = '';

function linhas(){ return SEMS[TAB] ? SEMS[TAB].linhas : []; }
function passa(r, exceto){
  for(var i=0;i<DIMS.length;i++){
    var d = DIMS[i];
    if(d.key === exceto) continue;
    if(F[d.key].length && F[d.key].indexOf(d.get(r)) === -1) return false;
  }
  if(STF && exceto !== 'st' && !STF_OK[STF](r)) return false;
  if(Q){
    var termos = norm(Q).split(/\s+/).filter(Boolean);
    for(var j=0;j<termos.length;j++) if(r._busca.indexOf(termos[j]) === -1) return false;
  }
  return true;
}
function filtradas(exceto){ return linhas().filter(function(r){ return passa(r, exceto); }); }
function algumFiltro(){ return Q || STF || DIMS.some(function(d){ return F[d.key].length; }); }
function ppc(list){ if(!list.length) return null; return Math.round(list.filter(function(r){ return r.st === 'concluida'; }).length / list.length * 100); }
function conta(list, fn){ var m = {}; list.forEach(function(r){ var k = fn(r); m[k] = (m[k]||0) + 1; }); return m; }
function sortPt(a, b){ if(a === SEM) return 1; if(b === SEM) return -1; return a.localeCompare(b, 'pt-BR'); }
function gPassa(r, exceto){
  for(var i=0;i<GDIMS.length;i++){ var d = GDIMS[i]; if(d.key === exceto) continue; if(GF[d.key].length && GF[d.key].indexOf(d.get(r)) === -1) return false; }

}

/* ---------- filtros Área/Empresa (popover multi-seleção) ---------- */
function fecharPop(){ if(POP){ POP.el.remove(); POP = null; } }
function abrirPop(key){
  if(POP && POP.key === key){ fecharPop(); return; }
  fecharPop();
  var d = DIM[key];
  var cnt = conta(filtradas(key), d.get);
  var todos = Object.keys(conta(linhas(), d.get));
  F[key].forEach(function(v){ if(todos.indexOf(v) === -1) todos.push(v); });
  todos.sort(sortPt);
  var el = document.createElement('div');
  el.className = 'fpop';
  el.addEventListener('click', function(ev){ ev.stopPropagation(); });
  el.innerHTML = '<input type="search" placeholder="Procurar ' + esc(d.label.toLowerCase()) + '…"><div class="fpop-l"></div>'
    + '<div class="fpop-a"><button type="button" data-a="none">Limpar</button><button type="button" data-a="vis">Marcar visíveis</button><button type="button" data-a="ok">Fechar</button></div>';
  var lista = el.querySelector('.fpop-l'), busca = el.querySelector('input');
  function pinta(){
    var t = norm(busca.value);
    lista.innerHTML = todos.filter(function(v){ return !t || norm(v).indexOf(t) !== -1; }).map(function(v){
      var n = cnt[v] || 0, on = F[key].indexOf(v) !== -1;
      return '<label class="fpop-o' + (n ? '' : ' zero') + '"><input type="checkbox" value="' + esc(v) + '"' + (on ? ' checked' : '') + '>'
        + '<span class="n" title="' + esc(v) + '">' + esc(v) + '</span><span class="c">' + n + '</span>'
        + '<button type="button" class="only" data-v="' + esc(v) + '">só esta</button></label>';
    }).join('') || '<div class="muted" style="padding:8px">Nada encontrado.</div>';
  }
  pinta();
  busca.addEventListener('input', pinta);
  lista.addEventListener('change', function(ev){
    var v = ev.target.value, i = F[key].indexOf(v);
    if(ev.target.checked && i === -1) F[key].push(v);
    if(!ev.target.checked && i !== -1) F[key].splice(i, 1);
    render(true);
  });
  lista.addEventListener('click', function(ev){
    var b = ev.target.closest('.only'); if(!b) return;
    ev.preventDefault(); F[key] = [b.dataset.v]; render(true); pinta();
  });
  el.querySelector('.fpop-a').addEventListener('click', function(ev){
    var a = ev.target.dataset.a; if(!a) return;
    if(a === 'ok'){ fecharPop(); return; }
    if(a === 'none') F[key] = [];
    if(a === 'vis'){ var t = norm(busca.value); F[key] = todos.filter(function(v){ return (!t || norm(v).indexOf(t) !== -1) && cnt[v]; }); }
    render(true); pinta();
  });
  document.querySelector('.fgrp[data-dim="' + key + '"]').appendChild(el);
  POP = { key:key, el:el };
  setTimeout(function(){ busca.focus(); }, 30);
}
function toggleFiltro(key, v){
  var i = F[key].indexOf(v);
  if(i === -1) F[key].push(v); else F[key].splice(i, 1);
  render();
}

  POP_DIMS.forEach(function(k){
    var b = document.querySelector('.fsel[data-dim="' + k + '"]'), sel = F[k];

    b.querySelector('.vl').textContent = !sel.length ? 'Todas' : sel.length === 1 ? sel[0] : sel.length + ' selecionadas';
  });

  if(Q) chips.push('<span class="fchip" data-k="q">Busca: <b>' + esc(Q) + '</b> ✕</span>');
  var ch = document.getElementById('chips');
  ch.innerHTML = chips.join('');
  ch.parentNode.style.display = chips.length ? '' : 'none';

    if(c.dataset.k === 'q'){ Q = ''; document.getElementById('q').value = ''; render(); }
    else if(c.dataset.k === 'st'){ STF = null; render(); }
    else toggleFiltro(c.dataset.k, c.dataset.v);

/* chips com contagem + mini-barra; usado nas abas de semana e na Geral */
function chipsHtml(grupos, sel, parts, titulo){
  var chaves = Object.keys(grupos).sort(function(a, b){ return grupos[b].length - grupos[a].length || sortPt(a, b); });
  return { n: chaves.length, html: chaves.map(function(k){
    var g = grupos[k], n = g.length, by = conta(g, parts.fn);
    var bar = n ? parts.cores.map(function(x){ var q = by[x[0]] || 0; return q ? '<span style="width:' + (q / n * 100) + '%;background:' + x[1] + '"></span>' : ''; }).join('') : '';
    var cls = sel.length ? (sel.indexOf(k) !== -1 ? ' on' : ' dim') : '';
    return '<button type="button" class="bchip' + cls + '" data-v="' + esc(k) + '" title="' + esc(k) + ' — ' + titulo(g, by) + '. Clique para filtrar.">'
      + '<span class="t"><span class="nm">' + esc(k) + '</span><span class="vv"><b>' + n + '</b>' + (n ? ' · ' + parts.sub(g, by) : '') + '</span></span>'
      + '<span class="stack">' + bar + '</span></button>';

}

      + '<td class="just"><span class="causa">⚑ ' + esc(x.j || 'sem justificativa') + '</span></td>'
      + '<td><span class="st" style="--c:' + s.c + '">' + s.label + '</span></td></tr>';
  }).join('');
  v.innerHTML = '<div class="kstrip rk" id="rkpis">'
    +   rkpi('abertas',  'k-o',    'Abertas',               nf(ab), 'aguardando remoção')
    +   rkpi('vencidas', 'k-n',    'Vencidas',              nf(ve), 'prazo de necessidade passou')
    +   rkpi('vinc',     'k-navy', 'Na programação',        nf(vi), 'ligadas a atividades das 2 semanas')
    +   rkpi('removidas','k-c',    'Removidas',             nf(rm), 'desde ' + dm(SEMS.anterior.ini || SEMS.atual.ini))
    +   rkpi('acomp',    'k-a',    'Sinalizadas no campo',  nf(RACOMP.length), 'acompanhamento diário')
    + '</div>'
    + (RF === 'acomp' ? '' : '<section class="panel"><div class="panel-h"><h2>Restrições cadastradas</h2>'
    +   '<div class="rtools no-print"><span class="cnt" id="rcnt">' + list.length + (list.length === 1 ? ' restrição' : ' restrições') + '</span>'
    +   '<input id="rq" type="search" placeholder="Buscar restrição, atividade, empresa, responsável…" value="' + esc(RQ) + '">'
    +   (RF ? '<button type="button" class="btn" id="rclr">Mostrar todas</button>' : '') + '</div></div>'
    + '<div class="panel-b"><div class="tbl-wrap"><table class="acts"><thead><tr><th>Nº</th><th>Restrição</th><th>Atividade impactada</th><th>Empresa · Área</th><th>Responsável</th><th>Identificada</th><th>Necessidade</th><th>Status</th><th>Impacto · Ação</th></tr></thead>'
    + '<tbody>' + (rows || '<tr><td colspan="9" class="empty">Nenhuma restrição com os filtros atuais.</td></tr>') + '</tbody></table></div>'
    + '<div class="foot-note">Inclui as restrições em aberto da unidade, as removidas/canceladas a partir do início da semana anterior e as ligadas a atividades programadas nas duas semanas. Vencida = em aberto com data de necessidade anterior a ' + dmy(HOJE) + '.</div>'
    + '</div></section>')
    + '<section class="panel" id="p-racomp"><div class="panel-h"><h2>Sinalizadas no acompanhamento diário</h2><span class="hint">' + RACOMP.length + ' registro' + (RACOMP.length === 1 ? '' : 's') + ' · semanas ' + esc(SEMS.atual.semana || '') + (SEMS.anterior.semana ? ' e ' + esc(SEMS.anterior.semana) : '') + '</span></div>'
    + '<div class="panel-b"><div class="tbl-wrap"><table class="acts"><thead><tr><th>Dia</th><th>Empresa</th><th>Atividade</th><th>Área</th><th>Supervisor</th><th>Justificativa</th><th>Status da atividade</th></tr></thead>'
    + '<tbody>' + (acomp || '<tr><td colspan="7" class="empty">Nenhuma restrição sinalizada no acompanhamento diário.</td></tr>') + '</tbody></table></div></div></section>';
  v.querySelectorAll('#rkpis .kpi').forEach(function(el){ el.onclick = function(){
    var k = el.dataset.rf; RF = RF === k ? null : k; renderRestr();
  }; });
  var rc = document.getElementById('rclr'); if(rc) rc.onclick = function(){ RF = null; renderRestr(); };
  var rq = document.getElementById('rq'), rT;
  if(rq) rq.addEventListener('input', function(){
    clearTimeout(rT);
    rT = setTimeout(function(){ RQ = rq.value.trim(); renderRestr(); var n = document.getElementById('rq'); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 200);
  });
}

TAB = ['geral','atual','anterior','restr'].indexOf(h0) >= 0 ? h0 : 'geral';

setLive(LIVE.estado, '');
